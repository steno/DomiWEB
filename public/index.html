<!DOCTYPE html>
<html lang="es-DO">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DomiWEB · Walkthrough Machine</title>
    <style>
      :root {
        --bg: #0f1c17;
        --fg: #f2f5f1;
        --muted: #a8b5ae;
        --accent: #3d8b6e;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Iowan Old Style", Palatino, Georgia, serif;
        background:
          radial-gradient(ellipse at 20% 0%, #1a3a2e 0%, transparent 50%),
          radial-gradient(ellipse at 90% 80%, #243528 0%, transparent 45%),
          var(--bg);
        color: var(--fg);
        display: grid;
        place-items: center;
        padding: 2rem;
      }
      main { max-width: 36rem; }
      h1 {
        font-size: clamp(1.8rem, 4vw, 2.4rem);
        font-weight: 650;
        letter-spacing: -0.02em;
        margin: 0 0 0.75rem;
      }
      p { color: var(--muted); line-height: 1.55; margin: 0 0 1rem; }
      code {
        font-size: 0.9em;
        background: rgba(255,255,255,0.08);
        padding: 0.15em 0.4em;
        border-radius: 4px;
      }
      a { color: var(--accent); }
      ul { color: var(--muted); line-height: 1.7; padding-left: 1.1rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>DomiWEB</h1>
      <p>
        Pipeline de sitios locales para negocios de República Dominicana.
        Sitios en <code>/sites/&lt;slug&gt;/</code>
        · reclamo en <code>/claim/&lt;slug&gt;/</code>.
      </p>
      <ul>
        <li><a href="dashboard/">Pipeline dashboard</a> (local: <code>npm run dashboard</code>)</li>
        <li><a href="claim/taller-el-rayo/">Claim · Taller El Rayo</a></li>
        <li><a href="sites/taller-el-rayo/">Sitio · Taller El Rayo</a></li>
      </ul>
      <p>Si ves esta página, GitHub Pages está activo.</p>
    </main>
  </body>
</html>
