<!DOCTYPE html>
<html lang="es-DO">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taller Los Hermanos</title>
    <style>
        body {
            font-family: Georgia, "Times New Roman", Times, serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom right, #2c2c2c, #4f4f4f);
            color: white;
        }
        header {
            text-align: center;
            padding: 50px 20px;
            background-image: url('https://example.com/1.jpg');
            background-size: cover;
            background-position: center;
        }
        h1 {
            font-size: 3em;
            margin: 0;
        }
        p {
            font-size: 1.2em;
            margin: 10px 0;
        }
        .cta {
            margin-top: 20px;
            padding: 15px 30px;
            background-color: #4CAF50;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 1.2em;
        }
        .reviews {
            padding: 20px;
            background-color: #333;
            margin: 20px;
            border-radius: 5px;
        }
        .review {
            margin-bottom: 15px;
            font-style: italic;
        }
        footer {
            text-align: center;
            padding: 20px;
            background-color: #222;
        }
    </style>
</head>
<body>
    <header>
        <h1>Taller Los Hermanos</h1>
        <p>Taller mecánico en Santo Domingo</p>
        <p>Rating: 4.3 de 28 reseñas</p>
        <a href="tel:+18095550303" class="cta">Llámanos: +1 809-555-0303</a>
    </header>
    <div class="reviews">
        <div class="review">“Buen taller de barrio, precios justos.” – José</div>
    </div>
    <footer>
        Las reseñas y fotografías provienen de nuestro perfil público de Google · Algunas imágenes pueden ser ilustrativas
    </footer>
</body>
</html>
