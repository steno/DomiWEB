<!DOCTYPE html>
<html lang="es-DO">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Taller El Rayo</title>
<style>
:root {
  --bg: #0e1411;
  --ink: #f3f6f2;
  --muted: #a7b6ab;
  --accent: #c4a35a;
  --accent-2: #3f7a55;
  --panel: rgba(18, 28, 22, 0.78);
  --line: rgba(196, 163, 90, 0.28);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  color: var(--ink);
  font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  background: var(--bg);
  line-height: 1.5;
}
.hero {
  position: relative;
  min-height: 100vh;
  display: grid;
  align-items: end;
  padding: 1.25rem;
  overflow: hidden;
  background:
    linear-gradient(180deg, rgba(8,12,10,0.25) 0%, rgba(8,12,10,0.55) 45%, rgba(8,12,10,0.92) 100%),
    radial-gradient(ellipse at 20% 10%, rgba(63,122,85,0.35), transparent 50%),
    radial-gradient(ellipse at 85% 30%, rgba(196,163,90,0.18), transparent 45%),
    linear-gradient(135deg, #1a2820, #0e1411 55%, #182218);
}
.hero.has-photo {
  background-image:
    linear-gradient(180deg, rgba(8,12,10,0.2) 0%, rgba(8,12,10,0.62) 48%, rgba(8,12,10,0.94) 100%),
    var(--hero-image),
    linear-gradient(135deg, #1a2820, #0e1411);
  background-size: cover, cover, auto;
  background-position: center, center, center;
}
.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image: repeating-linear-gradient(
    -18deg,
    transparent 0 11px,
    rgba(255,255,255,0.015) 11px 12px
  );
  pointer-events: none;
}
.hero-inner {
  position: relative;
  z-index: 1;
  max-width: 920px;
  width: 100%;
  margin: 0 auto;
  padding: 2.5rem 0 2rem;
}
.kicker {
  display: inline-block;
  margin: 0 0 0.85rem;
  font-family: system-ui, sans-serif;
  font-size: 0.72rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent);
}
.brand {
  margin: 0;
  font-size: clamp(2.8rem, 9vw, 5.4rem);
  line-height: 0.95;
  letter-spacing: -0.035em;
  font-weight: 700;
  max-width: 12ch;
  text-wrap: balance;
}
.sub {
  margin: 1rem 0 0;
  color: var(--muted);
  font-size: clamp(1.05rem, 2.4vw, 1.25rem);
  max-width: 28rem;
}
.meta {
  margin: 1rem 0 0;
  color: var(--ink);
  font-family: system-ui, sans-serif;
  font-weight: 600;
  font-size: 0.95rem;
  letter-spacing: 0.02em;
}
.cta { margin: 1.5rem 0 0; display: flex; flex-wrap: wrap; gap: 0.75rem 1rem; align-items: center; }
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--accent);
  color: #1a1408;
  text-decoration: none;
  padding: 0.95rem 1.35rem;
  font-family: system-ui, sans-serif;
  font-weight: 700;
  font-size: 1rem;
  letter-spacing: 0.01em;
  border: 0;
}
.phone-hint {
  font-family: system-ui, sans-serif;
  color: var(--muted);
  font-size: 0.92rem;
}
.scroll-cue {
  margin-top: 2.25rem;
  font-family: system-ui, sans-serif;
  font-size: 0.78rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}
.wrap {
  max-width: 920px;
  margin: 0 auto;
  padding: 2.5rem 1.25rem 3.5rem;
}
section h2 {
  margin: 0 0 1.25rem;
  font-size: clamp(1.5rem, 3vw, 2rem);
  letter-spacing: -0.02em;
}
.quote {
  margin: 0 0 1.5rem;
  padding: 0;
  border: 0;
  background: transparent;
}
.quote blockquote {
  margin: 0;
  font-size: clamp(1.15rem, 2.4vw, 1.45rem);
  line-height: 1.35;
  letter-spacing: -0.01em;
  max-width: 34rem;
}
.quote figcaption {
  margin-top: 0.55rem;
  color: var(--muted);
  font-family: system-ui, sans-serif;
  font-size: 0.84rem;
}
.photos {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 0.55rem;
  margin: 2.5rem 0 0;
}
.photos img {
  width: 100%;
  height: 180px;
  object-fit: cover;
  background: #1c2620;
  filter: saturate(0.92) contrast(1.05);
}
footer {
  margin-top: 3rem;
  padding-top: 1rem;
  border-top: 1px solid var(--line);
  color: var(--muted);
  font-family: system-ui, sans-serif;
  font-size: 0.78rem;
}
@media (max-width: 640px) {
  .brand { max-width: none; }
  .hero-inner { padding-bottom: 1.5rem; }
}
</style>
</head>
<body>
  <header class="hero" >
    <div class="hero-inner">
      <p class="kicker">República Dominicana</p>
      <h1 class="brand">Taller El Rayo</h1>
      <p class="sub">Taller mecánico · Av. Independencia 123, Santo Domingo</p>
      <p class="meta">4.6★ en Google · 47 reseñas</p>
      <p class="cta"><a class="btn" href="tel:+18095550101">Llamar ahora</a>
       <span class="phone-hint">+1 809-555-0101</span></p>
      <p class="scroll-cue">Reseñas reales de Google ↓</p>
    </div>
  </header>
  <main class="wrap">
    <section>
      <h2>Lo que dicen en Google</h2>
      
      <figure class="quote">
        <blockquote>“Excelente trabajo, don Carlos dejó el carro como nuevo. Muy honestos.”</blockquote>
        <figcaption>— Luis M. · 5★</figcaption>
      </figure>

      <figure class="quote">
        <blockquote>“Buen precio y rápido. Recomendado en Gazcue.”</blockquote>
        <figcaption>— Ana R. · 5★</figcaption>
      </figure>

      <figure class="quote">
        <blockquote>“Arreglaron la transmisión sin vueltas.”</blockquote>
        <figcaption>— Pedro V. · 4★</figcaption>
      </figure>
    </section>
    
    <footer><p>Las reseñas provienen de nuestro perfil público de Google · Las fotografías son ilustrativas</p></footer>
  </main>
</body>
</html>
